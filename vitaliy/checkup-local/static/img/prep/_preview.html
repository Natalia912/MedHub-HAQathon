<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Clinic / PRIME — подготовка к чекапу</title>
<style>
:root{color-scheme:light;font-family:Arial,sans-serif;color:#184d3b;background:#eef5f1}*{box-sizing:border-box}body{margin:0;padding:42px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:0 0 28px}.brand{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:2px;color:#167953}h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-.8px}.note{margin:0 0 3px;font-size:13px;line-height:1.6;text-align:right}main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}figure{margin:0;padding:22px 18px 16px;background:#fff;border-radius:18px;border:1px solid #dbe7df}.icon{height:114px;display:grid;place-items:center}.icon img{width:96px;height:96px;display:block}figcaption{padding-top:14px}code{display:block;font-size:13px;font-weight:700;color:#167953}h2{margin:8px 0 0;font-size:15px;line-height:1.35;min-height:41px;font-weight:600}.small{display:flex;align-items:center;gap:12px;border-top:1px solid #eef5f1;margin-top:13px;padding-top:12px}.small img{width:48px;height:48px;display:block}.small span{font-size:11px;line-height:1.5;color:#167953}footer{display:flex;justify-content:space-between;gap:20px;margin-top:23px;font-size:12px;color:#167953}@media(max-width:1000px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){body{padding:20px}header{display:block}.note{text-align:left;margin-top:16px}h1{font-size:26px}main{grid-template-columns:repeat(2,minmax(0,1fr))}footer{display:block;line-height:1.6}}
</style></head><body>
<header><div><p class="brand">GREEN CLINIC / PRIME</p><h1>Подготовка к чекапу</h1></div><p class="note">10 иллюстраций к памяткам пациента<br>SVG · 96 × 96 · проверка в 48 px</p></header>
<main><figure><div class="icon"><img src="pr_thinners.svg" alt="Препараты, разжижающие кровь: позвоните врачу, не отменяйте самостоятельно"></div><figcaption><code>pr_thinners</code><h2>Препараты, разжижающие кровь</h2></figcaption><div class="small"><img src="pr_thinners.svg" alt="" aria-hidden="true"><span>48 px<br>Звонок врачу</span></div></figure>
<figure><div class="icon"><img src="pr_colon.svg" alt="Колоноскопия: подготовьте и выпейте раствор по схеме врача"></div><figcaption><code>pr_colon</code><h2>Колоноскопия</h2></figcaption><div class="small"><img src="pr_colon.svg" alt="" aria-hidden="true"><span>48 px<br>Раствор по схеме врача</span></div></figure>
<figure><div class="icon"><img src="pr_blood.svg" alt="Анализы крови: не есть 8–12 часов, воду пить можно"></div><figcaption><code>pr_blood</code><h2>Анализы крови</h2></figcaption><div class="small"><img src="pr_blood.svg" alt="" aria-hidden="true"><span>48 px<br>Натощак, воду можно</span></div></figure>
<figure><div class="icon"><img src="pr_gastro.svg" alt="Гастроскопия: не есть 8 часов и не пить 2 часа"></div><figcaption><code>pr_gastro</code><h2>Гастроскопия</h2></figcaption><div class="small"><img src="pr_gastro.svg" alt="" aria-hidden="true"><span>48 px<br>8 часов / 2 часа</span></div></figure>
<figure><div class="icon"><img src="pr_anesthesia.svg" alt="После наркоза: не садитесь за руль, возьмите сопровождающего"></div><figcaption><code>pr_anesthesia</code><h2>После наркоза</h2></figcaption><div class="small"><img src="pr_anesthesia.svg" alt="" aria-hidden="true"><span>48 px<br>Без руля, с сопровождающим</span></div></figure>
<figure><div class="icon"><img src="pr_us_abd.svg" alt="УЗИ брюшной полости: прийти натощак, не есть 6–8 часов"></div><figcaption><code>pr_us_abd</code><h2>УЗИ брюшной полости</h2></figcaption><div class="small"><img src="pr_us_abd.svg" alt="" aria-hidden="true"><span>48 px<br>Натощак</span></div></figure>
<figure><div class="icon"><img src="pr_us_pelvis.svg" alt="УЗИ малого таза: предпочтительно на 5–10 день цикла"></div><figcaption><code>pr_us_pelvis</code><h2>УЗИ малого таза</h2></figcaption><div class="small"><img src="pr_us_pelvis.svg" alt="" aria-hidden="true"><span>48 px<br>5–10 день цикла</span></div></figure>
<figure><div class="icon"><img src="pr_mammo.svg" alt="Маммография: не наносите дезодорант и крем на грудь и подмышки"></div><figcaption><code>pr_mammo</code><h2>Маммография</h2></figcaption><div class="small"><img src="pr_mammo.svg" alt="" aria-hidden="true"><span>48 px<br>Без дезодоранта</span></div></figure>
<figure><div class="icon"><img src="pr_ct.svg" alt="КТ грудной клетки: снимите металлические украшения"></div><figcaption><code>pr_ct</code><h2>КТ грудной клетки</h2></figcaption><div class="small"><img src="pr_ct.svg" alt="" aria-hidden="true"><span>48 px<br>Снять украшения</span></div></figure>
<figure><div class="icon"><img src="pr_ecg.svg" alt="ЭКГ и ЭхоКГ: не пить кофе и не курить за 2 часа"></div><figcaption><code>pr_ecg</code><h2>ЭКГ и ЭхоКГ</h2></figcaption><div class="small"><img src="pr_ecg.svg" alt="" aria-hidden="true"><span>48 px<br>Без кофе и сигарет</span></div></figure></main><footer><span>Единая палитра · скруглённые линии · без внешних ресурсов</span><span>Иллюстрации дополняют текст памяток</span></footer></body></html>
